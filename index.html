<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FC2C38" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Capital Lumber" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Capital Lumber receiving, South runs, and delivery dispatch."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/pwa/favicon-32.png" />
    <link
      rel="apple-touch-icon"
      sizes="1024x1024"
      href="/pwa/apple-touch-icon.png"
    />
    <title>Capital Lumber</title>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background: #f8f7f5;
          color: #0f172a;
          font-family:
            Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
        }

        .app-boot {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }

        .app-boot-card {
          width: min(360px, 100%);
          border: 1px solid #e2e8f0;
          border-radius: 18px;
          background: #ffffff;
          box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
          padding: 22px;
          text-align: center;
        }

        .app-boot-mark {
          width: 52px;
          height: 52px;
          margin: 0 auto 14px;
          border-radius: 16px;
          background: #ff2a3d;
          color: #ffffff;
          display: grid;
          place-items: center;
          font-size: 24px;
          font-weight: 900;
        }

        .app-boot-title {
          margin: 0;
          font-size: 20px;
          font-weight: 900;
          letter-spacing: -0.01em;
        }

        .app-boot-text {
          margin: 8px 0 0;
          color: #64748b;
          font-size: 14px;
          font-weight: 700;
          line-height: 1.45;
        }
      </style>

      <div class="app-boot" aria-live="polite">
        <div class="app-boot-card">
          <div class="app-boot-mark">CL</div>
          <p class="app-boot-title">Opening Capital Lumber</p>
          <p class="app-boot-text">Loading the latest dispatch records...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
